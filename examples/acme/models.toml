# What ACME's agents may be granted. Same contract as the distribution's own
# catalog: a grant is by name, and the endpoint lives with agentd.

[gemma-3-1b]
repo    = "unsloth/gemma-3-1b-it-GGUF"
file    = "gemma-3-1b-it-Q4_K_M.gguf"
size    = "769MB"
devices = "cpu"
role    = "short-form drafting and classification — cheap enough to run per post"

["qwen3.5-2b"]
repo    = "unsloth/Qwen3.5-2B-GGUF"
file    = "Qwen3.5-2B-Q4_K_M.gguf"
size    = "1.2GB"
devices = "cpu"
role    = "long-form drafting and summarising"

[qwen3-8b]
repo    = "unsloth/Qwen3-8B-GGUF"
file    = "Qwen3-8B-Q4_K_M.gguf"
size    = "~5GB"
devices = "gpu"
role    = "analysis that has to hold a lot of context at once"

[remote.claude-opus-4-5]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model    = "anthropic/claude-opus-4.5"
key_env  = "OPENROUTER_API_KEY"
enabled  = false
role     = "the frontier option for strategy work; off until someone turns it on"
